<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>晶靈樹醫 Pippa 的森林 ｜ 物件導向程式設計作品集</title>
  <style>
    :root {
      --bg: #11221f;
      --card-bg: rgba(22, 44, 40, 0.85);
      --fg: #d9f2e4;
      --accent: #ffe6a8;
      --btn-bg: #1c5244;
      --btn-hover: #287360;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 50% 30%, #1a3832 0%, #0d1a18 100%);
      color: var(--fg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      padding: 24px;
      line-height: 1.6;
    }
    .card {
      background: var(--card-bg);
      border: 1px solid rgba(217, 242, 228, 0.2);
      border-radius: 20px;
      padding: 36px 28px;
      max-width: 460px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0,0,0,0.4), 0 0 50px rgba(255, 230, 168, 0.08);
      backdrop-filter: blur(10px);
    }
    .badge {
      display: inline-block;
      font-size: 12px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 4px 12px;
      border-radius: 20px;
      background: rgba(255, 230, 168, 0.15);
      color: var(--accent);
      margin-bottom: 16px;
      font-weight: 600;
    }
    h1 {
      font-size: 26px;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 8px;
      letter-spacing: 0.02em;
    }
    p.desc {
      font-size: 14px;
      opacity: 0.82;
      margin-bottom: 28px;
    }
    .primary-btn {
      display: block;
      width: 100%;
      padding: 16px 20px;
      font-size: 16px;
      font-weight: 700;
      color: #0c2a20;
      background: linear-gradient(135deg, #ffe6a8 0%, #82e1b4 100%);
      border: none;
      border-radius: 12px;
      text-decoration: none;
      cursor: pointer;
      box-shadow: 0 6px 18px rgba(130, 225, 180, 0.35);
      transition: transform 0.15s ease, filter 0.15s ease;
      margin-bottom: 14px;
    }
    .primary-btn:hover {
      transform: translateY(-2px);
      filter: brightness(1.08);
    }
    .timer-hint {
      font-size: 12px;
      opacity: 0.65;
      margin-bottom: 24px;
    }
    .links-title {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      opacity: 0.5;
      margin-bottom: 10px;
      border-top: 1px solid rgba(217, 242, 228, 0.12);
      padding-top: 20px;
    }
    .milestones {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .m-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 14px;
      background: rgba(0, 0, 0, 0.25);
      border: 1px solid rgba(217, 242, 228, 0.1);
      border-radius: 8px;
      color: var(--fg);
      text-decoration: none;
      font-size: 13px;
      transition: background 0.15s ease, border-color 0.15s ease;
    }
    .m-item:hover {
      background: rgba(28, 82, 68, 0.4);
      border-color: rgba(217, 242, 228, 0.3);
    }
    .m-tag {
      font-size: 11px;
      opacity: 0.6;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">後未來動物園 ・ 物種作品集</div>
    <h1>晶靈樹醫 Pippa</h1>
    <p class="desc">國立清華大學 科技藝術「物件導向程式設計與創作」</p>
    
    <a id="enterBtn" class="primary-btn" href="./m4-population/">🌿 進入最新進度：M4 晶靈樹醫的森林</a>
    <div class="timer-hint" id="timerHint">（<span id="countdown">4</span> 秒後自動跳轉，點擊取消）</div>

    <div class="links-title">歷程作品存檔</div>
    <div class="milestones">
      <a class="m-item" href="./m4-population/">
        <span>🌲 M4 族群：有機森林重塑（開發中）</span>
        <span class="m-tag">最新遊玩</span>
      </a>
      <a class="m-item" href="./m3-creature/">
        <span>🌿 M3 個體：晶靈樹醫的森林</span>
        <span class="m-tag">報告存檔</span>
      </a>
      <a class="m-item" href="./m2-species/">
        <span>✨ M2 物種：雛形展示</span>
        <span class="m-tag">互動原型</span>
      </a>
      <a class="m-item" href="./m0-outfit/">
        <span>🫧 M0 裝備：會呼吸的圓</span>
        <span class="m-tag">基礎測試</span>
      </a>
      <a class="m-item" href="https://github.com/zerookt/0oneeez" target="_blank" rel="noopener">
        <span>📦 GitHub 原始碼與開發紀錄</span>
        <span class="m-tag">Repository ↗</span>
      </a>
    </div>
  </div>

  <script>
    let timeLeft = 4;
    let timerActive = true;
    const countEl = document.getElementById('countdown');
    const hintEl = document.getElementById('timerHint');

    const timer = setInterval(() => {
      if (!timerActive) return;
      timeLeft -= 1;
      if (countEl) countEl.textContent = timeLeft;
      if (timeLeft <= 0) {
        clearInterval(timer);
        window.location.href = './m4-population/';
      }
    }, 1000);

    hintEl.addEventListener('click', () => {
      timerActive = false;
      hintEl.textContent = '已取消自動跳轉，可隨意點選下方連結';
      hintEl.style.opacity = '0.9';
      hintEl.style.color = '#ffe6a8';
    });
  </script>
</body>
</html>
