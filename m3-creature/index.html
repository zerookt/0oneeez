<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>晶靈樹醫的森林（M3）</title>
<style>
:root{--bg:#162c28;--fg:#d9f2e4}
@media (prefers-color-scheme: dark){:root{--bg:#162c28;--fg:#d9f2e4}}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg)}
canvas{display:block;touch-action:none}
#fps{position:fixed;top:6px;left:8px;font:12px/1.4 system-ui,sans-serif;color:var(--fg);opacity:.6;pointer-events:none}
#phase{position:fixed;top:23px;left:8px;font:12px/1.4 system-ui,sans-serif;color:var(--fg);opacity:.75;pointer-events:none}
#energy{position:fixed;top:43px;left:8px;width:120px;height:7px;border:1px solid rgba(217,242,228,.4);border-radius:5px;overflow:hidden;background:rgba(0,0,0,.3);pointer-events:none}
#energy i{display:block;height:100%;width:50%;background:#ffe6a8;transition:width .25s linear,background .4s linear}
button{font:13px/1.3 system-ui,sans-serif;color:#d9f2e4;background:rgba(16,52,44,.78);border:1px solid rgba(217,242,228,.35);border-radius:9px;cursor:pointer;-webkit-user-select:none;user-select:none;touch-action:none}
button.on{background:rgba(130,225,180,.9);color:#0c2a20;border-color:#9ff0c8;font-weight:700}
#faceBtn{position:fixed;top:8px;right:8px;padding:7px 12px}

/* 觸控面板：上面那塊方形＝滑動區（滑動即可轉視角），下面兩顆是遠近 */
#pad{position:fixed;right:12px;bottom:calc(50px + env(safe-area-inset-bottom,0px));z-index:5;
     display:flex;flex-direction:column;gap:6px;align-items:center}
#padsurf{width:132px;height:118px;border-radius:14px;background:rgba(16,52,44,.6);
     border:1px solid rgba(217,242,228,.35);display:grid;place-items:center;text-align:center;
     font:11px/1.5 system-ui,sans-serif;color:var(--fg);touch-action:none;cursor:grab;
     -webkit-user-select:none;user-select:none}
#padsurf span{opacity:.6;padding:0 12px;pointer-events:none}
#padgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px;width:132px}
#padgrid button{height:36px;font-size:16px}

#hint{position:fixed;left:0;right:0;bottom:calc(10px + env(safe-area-inset-bottom,0px));text-align:center;font:12px/1.4 system-ui,sans-serif;color:var(--fg);opacity:.5;pointer-events:none}
</style></head><body>
<div id="fps"></div>
<div id="phase"></div>
<div id="energy"><i></i></div>
<button id="faceBtn" class="ui">正面看我</button>

<div id="pad" class="ui">
  <div id="padsurf" class="ui" title="在這裡滑動＝轉視角"><span>在此滑動<br>＝轉視角</span></div>
  <div id="padgrid">
    <button data-cam="l" title="視角往左">◀</button>
    <button data-cam="r" title="視角往右">▶</button>
    <button data-cam="zi" title="拉近">＋</button>
    <button data-cam="zo" title="拉遠">－</button>
  </div>
</div>

<div id="hint">WASD／方向鍵移動 ・ Space↑ Shift↓ ・ 拖曳或右下滑動＝轉視角 ・ ◀▶＝左右轉 ・ 點牠＝互動（連點三下會打滾） ・ 點真菌＝餵食 ・ 點空白＝震動 ・ F＝正面看我 ・ N＝切換日夜 ・ R＝回起始點 ・ M＝滑鼠飛行</div>
<script src="p5.min.js"></script>
<script src="sketch.js?v=2"></script>
</body></html>
